<style>
:root{

*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{

}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}

.nota{background:var(--c-soft);border-radius:12px;padding:10px 14px;font-weight:700;margin:12px 0}

.lab{display:block;font-weight:800;margin:10px 0 4px}
.nm{width:100%;font:inherit;font-weight:700;padding:12px 14px;border:2px solid var(--c);border-radius:12px;background:#fff;color:var(--ink);min-height:50px}
.msg{color:#9B1C1C;font-weight:800;margin:8px 0 0;min-height:1.2em}
.saida{animation:pop .5s ease both}
.cert{background:#FFFCF4;border:6px double var(--c);border-radius:8px;padding:22px 14px 18px;margin-top:12px;text-align:center;color:#1D2B4F;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cert::before{content:"";position:absolute;inset:6px;border:2px solid var(--c-soft);border-radius:4px;pointer-events:none}
.selo{width:72px;height:72px;border-radius:50%;background:var(--c);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--c-soft)}
.selo svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.c-tit{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(1.5rem,7vw,2.1rem);color:var(--c);line-height:1.15;margin:4px 0 10px}
.c-p{margin:6px 0;font-size:.98rem}
.c-nome{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:clamp(1.4rem,6.5vw,2rem);border-bottom:2px solid var(--c);display:inline-block;max-width:100%;padding:2px 10px;margin:6px 0 10px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chips span{background:var(--c-soft);color:var(--ink);border:1.5px solid var(--c);border-radius:99px;padding:3px 12px;font-weight:800;font-size:.9rem}
.c-frase{font-family:Georgia,'Times New Roman',serif;font-style:italic;margin:14px 6px;font-size:1.02rem}
.assin{margin-top:16px;font-size:.92rem}
.sig{font-family:'Brush Script MT','Segoe Script','Snell Roundhand',cursive;font-size:1.9rem;line-height:1}
.linha{height:2px;background:var(--ink);width:70%;margin:2px auto 4px}
.c-data{font-size:.85rem;color:var(--muted);font-weight:700;margin:12px 0 2px}
.c-aviso{font-size:.78rem;color:var(--muted);margin:0}
.dica{font-weight:800;margin:10px 0 0;text-align:center}
.eye{background:none;border:0;color:#8A8F9E;padding:8px;min-width:44px;min-height:44px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.eye svg{width:24px;height:24px}
.eye[aria-expanded="true"]{color:var(--c);background:var(--c-soft)}
.solbox{margin-top:6px;animation:pop .35s ease both}
.solbox[hidden]{display:none}
.rodape{margin-top:22px;padding-top:14px;border-top:2px solid var(--line);text-align:center;color:var(--muted);font-weight:700;font-size:.95rem}
.rodape b{color:var(--ink)}
#pop{position:fixed;inset:0;background:rgba(29,43,79,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
#pop[hidden]{display:none}
.pop-box{background:var(--warn);color:var(--warn-ink);border:4px solid #1D2B4F;border-radius:22px;padding:20px 18px;max-width:440px;width:100%;text-align:center;animation:pop .45s ease both}
.pop-box .ic{font-size:2.6rem;line-height:1}
.pop-box h2{font-size:1.5rem;margin:6px 0 8px}
.pop-box p{font-weight:700}
.pop-box .btn{background:#1D2B4F;color:#fff;width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Conteúdo das 4 turmas (linguagem simples) ---------- */
const T={
"7b":{
 serie:"7ºB",disc:"Educação Financeira",aulas:"1ª e 2ª aula",hor:"08:00 às 09:40",plat:"Matific",
 sub:"Porcentagem, desconto e juros",

 fig:"Com 15% de desconto, você paga 85% do preço.",
 blocos:[

  ["🛠️ Como fazer: multiplicar com vírgula",[

 ],
 exemplos:[

  sz=fit(nome,serif,700,"italic",92,960);x.font=`italic 700 ${sz}px ${serif}`;x.fillStyle=ink;x.fillText(nome,W/2,y);
  const nw=x.measureText(nome).width;x.strokeStyle=cor;x.lineWidth=5;x.beginPath();x.moveTo(W/2-nw/2-24,y+22);x.lineTo(W/2+nw/2+24,y+22);x.stroke();
  y+=100;x.fillStyle=ink;x.font=`500 40px ${sans}`;x.fillText("revisou com dedicação os assuntos de",W/2,y);
  y+=62;x.font=`800 44px ${sans}`;y=wrap(t.disc+", "+t.serie+":",940,56,y);
  y+=30;
  x.font=`800 36px ${sans}`;
  const larg=c.assuntos.map(a=>x.measureText(a).width+64);
  const linhas=[];let cur=[],soma=0;
  larg.forEach((w,i)=>{if(cur.length&&soma+w+18>1000){linhas.push(cur);cur=[];soma=0}cur.push(i);soma+=w+(cur.length>1?18:0)});
  if(cur.length)linhas.push(cur);
  linhas.forEach(l=>{
    const tot=l.reduce((a,i)=>a+larg[i],0)+18*(l.length-1);let px=W/2-tot/2;
    l.forEach(i=>{rr(px,y-44,larg[i],68,34);x.fillStyle=soft;x.fill();x.strokeStyle=cor;x.lineWidth=3;x.stroke();
      x.fillStyle=ink;x.font=`800 36px ${sans}`;x.fillText(c.assuntos[i],px+larg[i]/2,y);px+=larg[i]+18});
    y+=92;
  });
  y+=30;x.fillStyle=ink;x.font=`italic 500 46px ${serif}`;y=wrap("“"+c.frase+"”",900,66,y);
  y+=60;
  x.font=`90px 'Brush Script MT','Segoe Script','Snell Roundhand',cursive`;x.fillStyle=ink;x.fillText("Thiago Fernando",W/2,y);
  y+=18;x.strokeStyle=ink;x.lineWidth=3;x.beginPath();x.moveTo(W/2-260,y);x.lineTo(W/2+260,y);x.stroke();
  y+=52;x.font=`800 38px ${sans}`;x.fillText("Prof. Thiago Fernando",W/2,y);
  y+=48;x.font=`500 34px ${sans}`;x.fillText("Licenciado em Matemática",W/2,y);
  y+=46;x.fillText("Escola Estadual Moacyr Amaral",W/2,y);
  y+=76;x.fillStyle=mut;x.font=`700 30px ${sans}`;x.fillText("Aula de 10 de novembro de 2026",W/2,y);
  y+=44;x.font=`500 26px ${sans}`;x.fillText("Incentivo à aprendizagem. Não substitui a tarefa na Sala do Futuro.",W/2,y);
  return new Promise(res=>cv.toBlob(res,"image/png"));
}
async function pegarDownloads(){
  return {save:async({filename,data})=>{
    const u=URL.createObjectURL(data);
    const a=document.createElement("a");a.href=u;a.download=filename;a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),8000);
    return {status:"saved"};
  }};
}
function certCard(id){
  const t=T[id],c=CERT[id];
  const box=document.createElement("div");box.className="card big";
  box.innerHTML=`<h2>🎓 Seu certificado</h2><p>Você chegou ao final! Digite seu nome completo para gerar o seu certificado de revisão.</p><label class="lab" for="nm">Nome completo</label><input id="nm" class="nm" type="text" maxlength="60" autocomplete="off" autocapitalize="words" placeholder="Escreva aqui o seu nome"><div class="ctrl"><button class="btn gen">Gerar certificado</button></div><p class="msg" role="status"></p><div class="saida"></div>`;
  const inp=box.querySelector(".nm"),msg=box.querySelector(".msg"),saida=box.querySelector(".saida");
  function gerar(){
    const nome=inp.value.trim().replace(/\s+/g," ");
    if(nome.split(" ").length<2||nome.length<5){msg.textContent="Digite seu nome completo (nome e sobrenome).";saida.replaceChildren();return}
    msg.textContent="";
    const w=document.createElement("div");
    w.innerHTML=`<div class="cert"><div class="selo"><svg viewBox="0 0 48 48" aria-hidden="true">${c.icone}</svg></div>
    <div class="c-tit">Certificado de Revisão</div>
    <p class="c-p">Certifico que</p>
    <div class="c-nome"></div>
    <p class="c-p">revisou com dedicação os assuntos de <b>${t.disc}</b>, ${t.serie}:</p>
    <div class="chips">${c.assuntos.map(a=>`<span>${a}</span>`).join("")}</div>
    <p class="c-frase">“${c.frase}”</p>
    <div class="assin"><div class="sig">Thiago Fernando</div><div class="linha"></div><b>Prof. Thiago Fernando</b><br>Licenciado em Matemática<br>Escola Estadual Moacyr Amaral</div>
    <p class="c-data">Aula de 10 de novembro de 2026</p>
    <p class="c-aviso">Incentivo à aprendizagem. Não substitui a tarefa na Sala do Futuro.</p></div>
    <p class="dica">📸 Tire um print da tela para guardar ou enviar. Você também pode baixar o certificado.</p>`;
    w.querySelector(".c-nome").textContent=nome;
    saida.replaceChildren(w);
    pegarDownloads().then(dl=>{
      if(!dl)return;
      const row=document.createElement("div");row.className="ctrl";row.style.justifyContent="center";
      const b=document.createElement("button");b.className="btn";b.textContent="⬇️ Baixar certificado";
      const m=document.createElement("p");m.className="dica";m.style.fontWeight="700";
      b.onclick=async()=>{
        m.textContent="";
        try{const blob=await desenharCert(id,nome);const r=await dl.save({filename:nomeArquivo(nome),data:blob});if(r&&r.status==="saved")m.textContent="Certificado salvo!"}
        catch(e){if(!e||e.code!=="declined")m.textContent="Não foi possível baixar. Tire um print da tela."}
      };
      row.appendChild(b);w.appendChild(row);w.appendChild(m);
    });
    saida.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  box.querySelector(".gen").onclick=gerar;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")gerar()});
  return box;
}

function stepper(ex){
  const box=document.createElement("div");box.className="card";
  box.innerHTML=`<h3>${ex.t}</h3><p><b>${ex.enun}</b></p>
  <div class="steps">${ex.passos.map((p,i)=>`<div class="step"><div class="n">Passo ${i+1} de ${ex.passos.length}</div><div>${p[0]}</div><div class="eq">${p[1]}</div></div>`).join("")}</div>
  <div class="resp" hidden>${ex.resp}</div>
  <div class="ctrl"><button class="btn next">Mostrar o 1º passo</button><button class="btn ghost reset" hidden>Recomeçar</button></div>`;
  const steps=[...box.querySelectorAll(".step")],next=box.querySelector(".next"),reset=box.querySelector(".reset"),resp=box.querySelector(".resp");
  let i=0;
  next.onclick=()=>{
    steps[i].classList.add("show");i++;
    if(i<steps.length){next.textContent=`Mostrar o ${i+1}º passo`}
    else{next.hidden=true;resp.hidden=false;reset.hidden=false}
  };
  reset.onclick=()=>{steps.forEach(s=>s.classList.remove("show"));i=0;resp.hidden=true;reset.hidden=true;next.hidden=false;next.textContent="Mostrar o 1º passo"};
  return box;
}

function turma(id){
  const t=T[id];
  document.title=`${t.serie} – ${t.disc} – Revisa Aí`;
  app.setAttribute("data-t",id);
  app.innerHTML=`
  <div class="topo"><a href="#">← Todas as turmas</a>
    <h1>${t.serie}: ${t.disc}</h1></div>
  ${avisoTurma(t)}
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-p="aula">1. Aula</button>
    <button class="tab" role="tab" data-p="passo">2. Passo a passo</button>
    <button class="tab" role="tab" data-p="pratique">3. Pratique</button>
    <button class="tab" role="tab" data-p="videos">4. Vídeos</button>
  </div>
  <section id="painel"></section>
  ${avisoTurma(t)}
  ${rodape()}`;
  const painel=document.getElementById("painel"),tabs=[...app.querySelectorAll(".tab")];
  const views={
   aula:()=>{
     const d=document.createElement("div");d.className="panel";
     d.innerHTML=`<div class="card big"><h2>${t.sub}</h2><p>${t.abertura}</p></div>
     <figure class="fig">${SVG[id]}<figcaption>${t.fig}</figcaption></figure>
     ${t.blocos.map(b=>`<div class="bloco"><h3>${b[0]}</h3><ul>${b[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
     ${t.aviso2?`<div class="nota">🔌 ${t.aviso2}</div>`:""}
     <div class="ctrl"><button class="btn go" data-p="passo">Ir para o passo a passo</button></div>`;
     return d},
   passo:()=>{
     const d=document.createElement("div");d.className="panel";
     d.innerHTML=`<div class="nota">Toque no botão para ver um passo de cada vez.</div>`;
     t.exemplos.forEach(e=>d.appendChild(stepper(e)));
     d.insertAdjacentHTML("beforeend",`<div class="ctrl"><button class="btn go" data-p="pratique">Ir para os exercícios</button></div>`);
     return d},
   pratique:()=>{
     const d=document.createElement("div");d.className="panel";
     d.innerHTML=`<div class="card big"><h2>Pratique no caderno</h2><p>Faça os exercícios e as soluções no caderno. Tente primeiro; depois toque no olhinho para ver a solução.</p></div>
     ${t.ex.map((e,i)=>`<div class="card ex"><span class="nivel">${e.n}</span><h3><span class="num">${i+1}</span>Exercício ${i+1}</h3><p class="enun">${e.enun}</p><button class="eye" aria-expanded="false" aria-label="Ver a solução do exercício ${i+1}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button><div class="solbox" hidden><ol>${e.sol.map(s=>`<li>${s}</li>`).join("")}</ol><div class="resp">Resposta: ${e.resp}</div></div></div>`).join("")}
     <div class="ctrl"><button class="btn go" data-p="videos">Ver os vídeos</button></div>`;
     return d},
   videos:()=>{
     const d=document.createElement("div");d.className="panel";
     d.innerHTML=`<div class="card big"><h2>Ficou com dúvida?</h2><p>Assista a um vídeo para tirar dúvidas ou aprender mais. O botão abre o YouTube.</p></div>
     ${t.videos.map(v=>`<a class="vid" href="${yt(v[1])}" target="_blank" rel="noopener">▶ ${v[0]}<span>Buscar no YouTube</span></a>`).join("")}`;d.appendChild(certCard(id));
     return d}
  };
  function show(p){
    tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.p===p));
    painel.replaceChildren(views[p]());
    painel.querySelectorAll(".eye").forEach(b=>b.onclick=()=>{const box=b.nextElementSibling,abrir=box.hidden;box.hidden=!abrir;b.setAttribute("aria-expanded",abrir)});
    painel.querySelectorAll(".go").forEach(b=>b.onclick=()=>{show(b.dataset.p);app.querySelector(".tabs").scrollIntoView({behavior:"smooth",block:"start"})});
  }
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.p));
  show("aula");
  window.scrollTo(0,0);
}
